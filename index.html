<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AsciiMachine</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #c4f135;
            --border: #334155;
        }

        body {
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 3rem 1rem;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border);
        }

        h1 {
            margin-top: 0;
            color: var(--text-main);
            font-size: 1.8rem;
            letter-spacing: -0.5px;
        }

        h1 span {
            color: var(--accent);
        }

        .subtitle {
            color: var(--text-muted);
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }

        .input-group {
            margin-bottom: 2rem;
        }

        label {
            display: block;
            margin-bottom: 0.75rem;
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
        }

        textarea {
            width: 100%;
            box-sizing: border-box;
            background: var(--bg-color);
            color: var(--accent);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1.25rem;
            font-family: 'Consolas', monospace;
            font-size: 1.1rem;
            resize: vertical;
            min-height: 120px;
            transition: border-color 0.2s;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        .output-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.25rem;
        }

        .output-card {
            background: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1.25rem;
        }

        .output-card h3 {
            margin: 0 0 0.75rem 0;
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .output-value {
            font-family: 'Consolas', monospace;
            word-wrap: break-word;
            color: var(--text-main);
            font-size: 1.05rem;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>AsciiMachine <span>Translator</span></h1>
        <p class="subtitle">Ketik teks pada kolom di bawah. Sistem akan otomatis menerjemahkannya ke dalam bahasa mesin dan format data lainnya secara real-time.</p>
        
        <div class="input-group">
            <label for="inputText">Bahasa Manusia (Teks Input)</label>
            <textarea id="inputText" placeholder="Ketik kalimat di sini..."></textarea>
        </div>

        <div class="output-grid">
            <div class="output-card">
                <h3>Nilai ASCII (Desimal)</h3>
                <div id="outAscii" class="output-value">-</div>
            </div>
            <div class="output-card">
                <h3>Bahasa Mesin (Biner 8-bit)</h3>
                <div id="outBinary" class="output-value">-</div>
            </div>
            <div class="output-card">
                <h3>Enkoding Base64</h3>
                <div id="outBase64" class="output-value">-</div>
            </div>
        </div>
    </div>

    <script>
        const inputEl = document.getElementById('inputText');
        const outAscii = document.getElementById('outAscii');
        const outBinary = document.getElementById('outBinary');
        const outBase64 = document.getElementById('outBase64');

        inputEl.addEventListener('input', () => {
            const text = inputEl.value;
            
            if (!text) {
                outAscii.textContent = '-';
                outBinary.textContent = '-';
                outBase64.textContent = '-';
                return;
            }

            try {
                // 1. Ambil nilai desimal ASCII
                const asciiArr = Array.from(text).map(char => char.charCodeAt(0));
                outAscii.textContent = asciiArr.join(' ');

                // 2. Ubah desimal ke Biner basis 2 (format 8-bit per karakter)
                const binArr = asciiArr.map(num => num.toString(2).padStart(8, '0'));
                outBinary.textContent = binArr.join(' ');

                // 3. Ubah teks murni ke Base64
                outBase64.textContent = btoa(text);
            } catch (error) {
                outBase64.textContent = 'Terjadi kesalahan pemrosesan karakter.';
            }
        });
    </script>
</body>
</html>
